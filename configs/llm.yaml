device:
  provider: vllm
  model: Qwen/Qwen2.5-3B-Instruct
  base_url: http://localhost:8000/v1
  max_tokens: 200
  temperature: 0.1
  memory_mb: 8192 


# Set false to use real Cloud API + local GPU Device LLM
use_mock: false

cache_responses: false
cache_dir: .llm_cache

experience_reuse:
  enabled: false
  store_path: experience_store.json

